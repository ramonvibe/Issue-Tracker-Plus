services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://makeit:makeit@db:5432/makeit
      PORT: 8080
      BASE_URL: ${BASE_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: makeit
      POSTGRES_USER: makeit
      POSTGRES_PASSWORD: makeit
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makeit -d makeit"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
